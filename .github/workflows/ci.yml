name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run unit tests (release)
        run: cargo test --release
      - name: Verify CLI and benchmark build
        run: cargo build --release --bins
