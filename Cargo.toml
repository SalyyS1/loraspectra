[package]
name = "loraspectra"
version = "1.53.0"
edition = "2021"
default-run = "loraspectra"
description = "Spectral SVD auditor, Knots joint-SVD & TSV multi-adapter subspace aligner, LoRA-GA initializer, orthogonal projector, compressor, and TIES/DARE merger for .safetensors LoRA adapters"
license = "MIT"
repository = "https://github.com/SalyyS1/loraspectra"
keywords = ["lora", "safetensors", "svd", "llm", "model-merging"]
categories = ["command-line-utilities", "science", "mathematics"]

[lib]
name = "loraspectra"
path = "src/lib.rs"

[[bin]]
name = "loraspectra"
path = "src/main.rs"

[[bin]]
name = "loraspectra-bench"
path = "src/bin/bench.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
